name: Go checks
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify interactive terminal behavior
        run: |
          go build -o bin/ibkr ./cmd/ibkr
          python3 -m pip install pexpect==4.9.0 pyte==0.8.2
          python3 scripts/test_terminal.py
      - run: go build -o bin/ibkr ./cmd/ibkr
