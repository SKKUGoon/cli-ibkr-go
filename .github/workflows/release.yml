name: Build and release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify interactive terminal behavior
        run: |
          go build -o bin/ibkr ./cmd/ibkr
          python3 -m pip install pexpect==4.9.0 pyte==0.8.2
          python3 scripts/test_terminal.py
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging
          for target in linux_amd64 darwin_arm64; do
            GOOS="${target%_*}" GOARCH="${target#*_}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X ibkr-go/ibkr.Version=${GITHUB_REF_NAME#v}" -o staging/ibkr ./cmd/ibkr
            tar -czf "dist/ibkr-${GITHUB_REF_NAME}-${target}.tar.gz" -C staging ibkr
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          name: ibkr ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
